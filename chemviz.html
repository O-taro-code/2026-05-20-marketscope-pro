<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChemViz — 化学式ビジュアライザー</title>
  <script src="https://unpkg.com/smiles-drawer@2.1.7/dist/smiles-drawer.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #21262d;
      --border: #30363d;
      --text: #c9d1d9;
      --text-dim: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79b8ff;
      --success: #3fb950;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    header h1 { font-size: 1.3rem; font-weight: 700; color: var(--accent); }
    header p { color: var(--text-dim); font-size: 0.8rem; }
    .app {
      display: grid;
      grid-template-columns: 255px 1fr 275px;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .search-box {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .search-row { display: flex; gap: 6px; }
    .search-row input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 6px 9px;
      font-size: 0.8125rem;
      outline: none;
    }
    .search-row input:focus { border-color: var(--accent); }
    .search-row input::placeholder { color: var(--text-dim); }
    .hint { margin-top: 5px; font-size: 0.7rem; color: var(--text-dim); }
    button {
      background: var(--accent);
      border: none;
      border-radius: 6px;
      color: #0d1117;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 11px;
      transition: background 0.15s;
    }
    button:hover { background: var(--accent-hover); }
    .presets { flex: 1; overflow-y: auto; padding: 6px 8px 12px; }
    .presets::-webkit-scrollbar { width: 3px; }
    .presets::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .cat-label {
      color: var(--text-dim);
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 8px 2px 4px;
    }
    .mol-grid { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
    .mol-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      cursor: pointer;
      font-size: 0.73rem;
      font-weight: 400;
      padding: 3px 8px;
      transition: all 0.12s;
    }
    .mol-btn:hover { background: var(--accent); border-color: var(--accent); color: #0d1117; }
    .mol-btn.active { background: var(--accent); border-color: var(--accent); color: #0d1117; font-weight: 600; }

    /* ── Canvas ── */
    .canvas-area {
      background: #0d1117;
      position: relative;
      overflow: hidden;
    }
    .canvas-controls {
      position: absolute;
      bottom: 14px;
      right: 14px;
      display: flex;
      gap: 5px;
      z-index: 10;
    }
    .ctrl-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s;
    }
    .ctrl-btn:hover { background: var(--surface2); border-color: var(--accent); color: var(--accent); }
    .canvas-wrapper {
      width: 100%;
      height: 100%;
      cursor: grab;
      position: relative;
    }
    .canvas-wrapper:active { cursor: grabbing; }
    #mol-canvas {
      position: absolute;
      top: 50%;
      left: 50%;
      border-radius: 8px;
      display: none;
    }
    .placeholder {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--text-dim);
      text-align: center;
      pointer-events: none;
    }
    .placeholder .icon { font-size: 3.5rem; margin-bottom: 10px; }
    .placeholder p { font-size: 0.875rem; line-height: 1.6; }
    .zoom-hint {
      position: absolute;
      bottom: 14px;
      left: 14px;
      font-size: 0.7rem;
      color: var(--text-dim);
      pointer-events: none;
    }

    /* ── Info panel ── */
    .info-panel {
      background: var(--surface);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      padding: 14px;
    }
    .info-panel::-webkit-scrollbar { width: 3px; }
    .info-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .info-section { margin-bottom: 18px; }
    .info-section h3 {
      color: var(--text-dim);
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--border);
    }
    .mol-name { font-size: 1.2rem; font-weight: 700; margin-bottom: 3px; }
    .mol-formula {
      font-size: 1.05rem;
      color: var(--accent);
      font-family: 'Courier New', monospace;
      margin-bottom: 7px;
    }
    .mol-desc { font-size: 0.78rem; color: var(--text-dim); line-height: 1.55; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .stat-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 9px 10px;
    }
    .stat-label { font-size: 0.67rem; color: var(--text-dim); margin-bottom: 2px; }
    .stat-value { font-size: 0.95rem; font-weight: 600; }
    .element-list { display: flex; flex-direction: column; gap: 5px; }
    .element-item {
      display: flex;
      align-items: center;
      gap: 9px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 7px 10px;
    }
    .elem-badge {
      width: 34px;
      height: 34px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.83rem;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .elem-info { flex: 1; min-width: 0; }
    .elem-name { font-size: 0.8rem; font-weight: 600; }
    .elem-detail { font-size: 0.7rem; color: var(--text-dim); }
    .elem-count { font-size: 1rem; font-weight: 700; color: var(--accent); flex-shrink: 0; }
    .smiles-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-family: 'Courier New', monospace;
      font-size: 0.76rem;
      word-break: break-all;
      color: var(--success);
      line-height: 1.5;
    }
    .empty-info {
      color: var(--text-dim);
      font-size: 0.85rem;
      text-align: center;
      padding: 50px 10px;
      line-height: 1.8;
    }
    .empty-info .icon { font-size: 2.5rem; margin-bottom: 8px; }
    .error-msg {
      background: #2d1b1b;
      border: 1px solid #5a2020;
      border-radius: 6px;
      color: #f85149;
      font-size: 0.78rem;
      padding: 8px 10px;
      margin-top: 6px;
      display: none;
    }
  </style>
</head>
<body>

<header>
  <h1>⚗️ ChemViz</h1>
  <p>化学式ビジュアライザー</p>
</header>

<div class="app">
  <!-- Left: Search + Presets -->
  <aside class="sidebar">
    <div class="search-box">
      <div class="search-row">
        <input type="text" id="smiles-input" placeholder="分子名 or SMILES を入力…" list="mol-list">
        <button onclick="drawFromInput()">描画</button>
      </div>
      <datalist id="mol-list"></datalist>
      <p class="hint">例: CCO (エタノール), c1ccccc1 (ベンゼン)</p>
      <div class="error-msg" id="error-msg"></div>
    </div>
    <div class="presets" id="presets"></div>
  </aside>

  <!-- Center: Canvas -->
  <main class="canvas-area">
    <div class="canvas-wrapper" id="canvas-wrapper">
      <div class="placeholder" id="placeholder">
        <div class="icon">🧪</div>
        <p>分子を選択するか<br>SMILESを入力してください</p>
      </div>
      <canvas id="mol-canvas"></canvas>
    </div>
    <div class="canvas-controls">
      <button class="ctrl-btn" onclick="zoom(1.25)" title="ズームイン">＋</button>
      <button class="ctrl-btn" onclick="zoom(0.8)" title="ズームアウト">－</button>
      <button class="ctrl-btn" onclick="resetView()" title="リセット" style="font-size:1rem;">⟳</button>
    </div>
    <div class="zoom-hint">スクロール: ズーム ／ ドラッグ: 移動</div>
  </main>

  <!-- Right: Info -->
  <aside class="info-panel">
    <div class="empty-info" id="empty-info">
      <div class="icon">📋</div>
      分子を選択すると<br>詳細情報が表示されます
    </div>
    <div id="mol-info" style="display:none">
      <div class="info-section">
        <h3>基本情報</h3>
        <div class="mol-name" id="info-name"></div>
        <div class="mol-formula" id="info-formula"></div>
        <div class="mol-desc" id="info-desc"></div>
      </div>
      <div class="info-section">
        <h3>物性値</h3>
        <div class="stat-grid">
          <div class="stat-card">
            <div class="stat-label">分子量</div>
            <div class="stat-value" id="info-mw"></div>
          </div>
          <div class="stat-card">
            <div class="stat-label">分類</div>
            <div class="stat-value" id="info-cat"></div>
          </div>
          <div class="stat-card">
            <div class="stat-label">元素の種類</div>
            <div class="stat-value" id="info-elems"></div>
          </div>
          <div class="stat-card">
            <div class="stat-label">総原子数</div>
            <div class="stat-value" id="info-atoms"></div>
          </div>
        </div>
      </div>
      <div class="info-section">
        <h3>元素組成</h3>
        <div class="element-list" id="elem-list"></div>
      </div>
      <div class="info-section">
        <h3>SMILES</h3>
        <div class="smiles-box" id="info-smiles"></div>
      </div>
    </div>
  </aside>
</div>

<script>

      { name: 'グルコース', formula: 'C6H12O6',   smiles: 'OC[C@H]1OC(O)[C@H](O)[C@@H](O)[C@@H]1O', mw: 180.16, cat: '生体分子', desc: '細胞のエネルギー源となる最重要な単糖類。' },
      { name: 'アドレナリン',formula:'C9H13NO3',  smiles: 'CNC[C@@H](O)c1ccc(O)c(O)c1',          mw: 183.21, cat: '生体分子', desc: 'ストレス時に分泌される副腎髄質ホルモン。' },
      { name: 'ドーパミン', formula: 'C8H11NO2',  smiles: 'NCCc1ccc(O)c(O)c1',                    mw: 153.18, cat: '生体分子', desc: '快楽・報酬・意欲に関わる神経伝達物質。' },

// ── State ─────────────────────────────────────────────────────────────────────
let drawer = null;
let scale = 1, tx = 0, ty = 0;
let dragging = false, lastMX = 0, lastMY = 0;
const CANVAS_W = 620, CANVAS_H = 500;

// ── Boot ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  drawer = new SmilesDrawer.Drawer({
    width: CANVAS_W,
    height: CANVAS_H,
    bondThickness: 1.6,
    bondLength: 32,
    shortBondLength: 0.85,
    atomVisualization: 'default',
    themes: {
      dark: {
        C: '#b0bec5',
        O: '#ef5350',
        N: '#42a5f5',
        H: '#78909c',
        S: '#ffca28',
        P: '#ff8f00',
        F: '#aed581',
        Cl: '#66bb6a',
        Br: '#bf360c',
        I: '#ce93d8',
        BACKGROUND: '#161b22',
      }
    }
  });

  buildPresets();
  setupInteraction();

  document.getElementById('smiles-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') drawFromInput();
  });

  // Load benzene as default
  const benzene = CATEGORIES[3].items[0];
  loadMolecule(benzene, null);
});

// ── Build preset list ─────────────────────────────────────────────────────────
function buildPresets() {
  const container = document.getElementById('presets');
  const datalist  = document.getElementById('mol-list');

  for (const cat of CATEGORIES) {
    const lbl = document.createElement('div');
    lbl.className = 'cat-label';
    lbl.textContent = cat.label;
    container.appendChild(lbl);

    const grid = document.createElement('div');
    grid.className = 'mol-grid';

    for (const mol of cat.items) {
      const btn = document.createElement('button');
      btn.className = 'mol-btn';
      btn.textContent = mol.name;
      btn.dataset.name = mol.name;
      btn.addEventListener('click', () => loadMolecule(mol, btn));
      grid.appendChild(btn);

      const opt = document.createElement('option');
      opt.value = mol.name;
      datalist.appendChild(opt);
    }
    container.appendChild(grid);
  }
}

// ── Canvas pan/zoom ───────────────────────────────────────────────────────────
function setupInteraction() {
  const wrapper = document.getElementById('canvas-wrapper');

  wrapper.addEventListener('wheel', e => {
    e.preventDefault();
    const f = e.deltaY > 0 ? 0.85 : 1.18;
    scale = Math.max(0.15, Math.min(10, scale * f));
    applyTransform();
  }, { passive: false });

  wrapper.addEventListener('mousedown', e => {
    dragging = true; lastMX = e.clientX; lastMY = e.clientY;
  });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    tx += e.clientX - lastMX; ty += e.clientY - lastMY;
    lastMX = e.clientX; lastMY = e.clientY;
    applyTransform();
  });
  window.addEventListener('mouseup', () => { dragging = false; });

  let lastPinch = null;
  wrapper.addEventListener('touchstart', e => {
    if (e.touches.length === 1) { dragging = true; lastMX = e.touches[0].clientX; lastMY = e.touches[0].clientY; }
  });
  wrapper.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length === 1 && dragging) {
      tx += e.touches[0].clientX - lastMX; ty += e.touches[0].clientY - lastMY;
      lastMX = e.touches[0].clientX; lastMY = e.touches[0].clientY;
      applyTransform();
    } else if (e.touches.length === 2) {
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      if (lastPinch) { scale = Math.max(0.15, Math.min(10, scale * d / lastPinch)); applyTransform(); }
      lastPinch = d;
    }
  }, { passive: false });
  wrapper.addEventListener('touchend', () => { dragging = false; lastPinch = null; });
}

function applyTransform() {
  const c = document.getElementById('mol-canvas');
  c.style.transform = `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(${scale})`;
}

function zoom(f) { scale = Math.max(0.15, Math.min(10, scale * f)); applyTransform(); }
function resetView() { scale = 1; tx = 0; ty = 0; applyTransform(); }

// ── Draw ──────────────────────────────────────────────────────────────────────
function loadMolecule(mol, btn) {
  document.querySelectorAll('.mol-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  document.getElementById('smiles-input').value = mol.smiles;
  hideError();
  renderSmiles(mol.smiles, () => updatePanel(mol));
}

function drawFromInput() {
  const raw = document.getElementById('smiles-input').value.trim();
  if (!raw) return;
  hideError();

  // Check if it's a known name
  for (const cat of CATEGORIES) {
    const found = cat.items.find(m => m.name === raw);
    if (found) {
      const btn = document.querySelector(`[data-name="${found.name}"]`);
      loadMolecule(found, btn);
      return;
    }
  }

  // Treat as raw SMILES
  document.querySelectorAll('.mol-btn').forEach(b => b.classList.remove('active'));
  const custom = { name: 'カスタム', formula: derivePlainFormula(raw), smiles: raw, mw: null, cat: 'SMILES入力', desc: 'ユーザー入力のSMILES文字列' };
  renderSmiles(raw, () => updatePanel(custom));
}

function renderSmiles(smiles, onSuccess) {
  SmilesDrawer.parse(smiles, tree => {
    const canvas = document.getElementById('mol-canvas');
    canvas.width  = CANVAS_W;
    canvas.height = CANVAS_H;
    canvas.style.display = 'block';
    document.getElementById('placeholder').style.display = 'none';
    resetView();
    drawer.draw(tree, 'mol-canvas', 'dark', false);
    if (onSuccess) onSuccess();
  }, err => {
    showError('解析エラー: ' + (err || '無効なSMILES'));
  });
}

// ── Info panel ────────────────────────────────────────────────────────────────
function updatePanel(mol) {
  document.getElementById('empty-info').style.display = 'none';
  document.getElementById('mol-info').style.display   = 'block';

  document.getElementById('info-name').textContent    = mol.name;
  document.getElementById('info-formula').innerHTML   = fmtFormula(mol.formula || '—');
  document.getElementById('info-desc').textContent    = mol.desc || '—';
  document.getElementById('info-mw').textContent      = mol.mw ? mol.mw + ' g/mol' : '—';
  document.getElementById('info-cat').textContent     = mol.cat || '—';
  document.getElementById('info-smiles').textContent  = mol.smiles;

  const comp = parseFormula(mol.formula || '');
  const types = Object.keys(comp).length;
  const total = Object.values(comp).reduce((s, n) => s + n, 0);
  document.getElementById('info-elems').textContent = types ? types + ' 種' : '—';
  document.getElementById('info-atoms').textContent = total ? total + ' 個' : '—';

  renderElemList(comp);
}

function renderElemList(comp) {
  const list = document.getElementById('elem-list');
  list.innerHTML = '';

  const order = ['C','H'];
  const keys  = Object.keys(comp).sort((a, b) => {
    const ia = order.indexOf(a), ib = order.indexOf(b);
    if (ia >= 0 && ib >= 0) return ia - ib;
    if (ia >= 0) return -1; if (ib >= 0) return 1;
    return a.localeCompare(b);
  });

  for (const sym of keys) {
    const count = comp[sym];
    const el    = ELEMENTS[sym];
    const color = el ? el.color : '#666';
    const lum   = hexLum(color);

    const item = document.createElement('div');
    item.className = 'element-item';
    item.innerHTML = `
      <div class="elem-badge" style="background:${color};color:${lum>0.45?'#111':'#eee'}">
        ${sym}
      </div>
      <div class="elem-info">
        <div class="elem-name">${el ? el.ja : sym}</div>
        <div class="elem-detail">${el ? `原子番号 ${el.no} · ${el.wt} g/mol` : ''}</div>
      </div>
      <div class="elem-count">×${count}</div>
    `;
    list.appendChild(item);
  }
  if (!keys.length) list.innerHTML = '<div style="color:var(--text-dim);font-size:.8rem">組成情報なし</div>';
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function fmtFormula(f) {
  return f.replace(/(\d+)/g, '<sub>$1</sub>');
}

function parseFormula(f) {
  const elems = {};
  const re = /([A-Z][a-z]?)(\d*)/g;
  let m;
  while ((m = re.exec(f)) !== null) {
    if (m[1]) elems[m[1]] = (elems[m[1]] || 0) + (parseInt(m[2]) || 1);
  }
  return elems;
}

function derivePlainFormula(smiles) {
  // Very rough: count bracketed and bare atoms from SMILES
  const counts = {};
  const re = /\[([A-Z][a-z]?)[\d@H+-]*\]|([A-Z][a-z]?)/g;
  let m;
  while ((m = re.exec(smiles)) !== null) {
    const sym = m[1] || m[2];
    if (sym && sym !== 'R') counts[sym] = (counts[sym] || 0) + 1;
  }
  return Object.entries(counts).map(([s, n]) => s + (n > 1 ? n : '')).join('');
}

function hexLum(hex) {
  const r = parseInt(hex.slice(1,3),16)/255;
  const g = parseInt(hex.slice(3,5),16)/255;
  const b = parseInt(hex.slice(5,7),16)/255;
  return 0.299*r + 0.587*g + 0.114*b;
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideError() {
  document.getElementById('error-msg').style.display = 'none';
}
</script>
