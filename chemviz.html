<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChemViz — 化学式ビジュアライザー</title>
  <script src="https://unpkg.com/smiles-drawer@2.1.7/dist/smiles-drawer.min.js"></script>
  <style>
    :root {
      --bg: #0d1117; --surface: #161b22; --surface2: #21262d;
      --border: #30363d; --text: #c9d1d9; --text-dim: #8b949e;
      --accent: #58a6ff; --accent-hover: #79b8ff; --success: #3fb950;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    header { background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 10px 20px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    header h1 { font-size: 1.3rem; font-weight: 700; color: var(--accent); }
    header p  { color: var(--text-dim); font-size: 0.8rem; flex: 1; }
    .palette-toggle { background: var(--surface2); border: 1px solid var(--border);
      border-radius: 7px; color: var(--text); cursor: pointer; font-size: 0.8rem;
      font-weight: 500; padding: 6px 13px; transition: all 0.15s; }
    .palette-toggle:hover { border-color: var(--accent); color: var(--accent); background: var(--surface2); }

    .app { display: grid; grid-template-columns: 255px 1fr 275px; flex: 1; overflow: hidden; }

    /* Sidebar */
    .sidebar { background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden; }
    .search-box { padding: 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .search-row { display: flex; gap: 6px; }
    .search-row input { flex: 1; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); padding: 6px 9px; font-size: 0.8125rem; outline: none; }
    .search-row input:focus { border-color: var(--accent); }
    .search-row input::placeholder { color: var(--text-dim); }
    .hint { margin-top: 5px; font-size: 0.7rem; color: var(--text-dim); }
    button { background: var(--accent); border: none; border-radius: 6px; color: #0d1117;
      cursor: pointer; font-size: 0.8rem; font-weight: 600; padding: 6px 11px; transition: background 0.15s; }
    button:hover { background: var(--accent-hover); }
    .presets { flex: 1; overflow-y: auto; padding: 6px 8px 12px; }
    .presets::-webkit-scrollbar { width: 3px; }
    .presets::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .cat-label { color: var(--text-dim); font-size: 0.65rem; font-weight: 600;
      letter-spacing: 0.07em; text-transform: uppercase; padding: 8px 2px 4px; }
    .mol-grid { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
    .mol-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 5px;
      color: var(--text); cursor: pointer; font-size: 0.73rem; font-weight: 400;
      padding: 3px 8px; transition: all 0.12s; }
    .mol-btn:hover { background: var(--accent); border-color: var(--accent); color: #0d1117; }
    .mol-btn.active { background: var(--accent); border-color: var(--accent); color: #0d1117; font-weight: 600; }

    /* Canvas */
    .canvas-area { background: #0d1117; position: relative; overflow: hidden; }
    .canvas-controls { position: absolute; bottom: 14px; right: 14px; display: flex; gap: 5px; z-index: 10; }
    .ctrl-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 7px;
      color: var(--text); cursor: pointer; font-size: 0.9rem; font-weight: 500;
      width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; transition: all 0.12s; }
    .ctrl-btn:hover { background: var(--surface2); border-color: var(--accent); color: var(--accent); }
    .canvas-wrapper { width: 100%; height: 100%; cursor: grab; position: relative; }
    .canvas-wrapper:active { cursor: grabbing; }
    #mol-canvas { position: absolute; top: 50%; left: 50%; border-radius: 8px; display: none; }
    .placeholder { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      display: flex; flex-direction: column; align-items: center;
      color: var(--text-dim); text-align: center; pointer-events: none; }
    .placeholder .icon { font-size: 3.5rem; margin-bottom: 10px; }
    .placeholder p { font-size: 0.875rem; line-height: 1.6; }
    .zoom-hint { position: absolute; bottom: 14px; left: 14px; font-size: 0.7rem;
      color: var(--text-dim); pointer-events: none; }

    /* Info panel */
    .info-panel { background: var(--surface); border-left: 1px solid var(--border);
      overflow-y: auto; padding: 14px; }
    .info-panel::-webkit-scrollbar { width: 3px; }
    .info-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .info-section { margin-bottom: 18px; }
    .info-section h3 { color: var(--text-dim); font-size: 0.65rem; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px;
      padding-bottom: 5px; border-bottom: 1px solid var(--border); }
    .mol-name { font-size: 1.2rem; font-weight: 700; margin-bottom: 3px; }
    .mol-formula { font-size: 1.05rem; color: var(--accent); font-family: 'Courier New', monospace; margin-bottom: 7px; }
    .mol-desc { font-size: 0.78rem; color: var(--text-dim); line-height: 1.55; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .stat-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 7px; padding: 9px 10px; }
    .stat-label { font-size: 0.67rem; color: var(--text-dim); margin-bottom: 2px; }
    .stat-value { font-size: 0.95rem; font-weight: 600; }
    .element-list { display: flex; flex-direction: column; gap: 5px; }
    .element-item { display: flex; align-items: center; gap: 9px; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 7px; padding: 7px 10px; }
    .elem-badge { width: 34px; height: 34px; border-radius: 5px; display: flex; align-items: center;
      justify-content: center; font-weight: 700; font-size: 0.83rem; flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.15); }
    .elem-info { flex: 1; min-width: 0; }
    .elem-name { font-size: 0.8rem; font-weight: 600; }
    .elem-detail { font-size: 0.7rem; color: var(--text-dim); }
    .elem-count { font-size: 1rem; font-weight: 700; color: var(--accent); flex-shrink: 0; }
    .smiles-box { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
      padding: 8px 10px; font-family: 'Courier New', monospace; font-size: 0.76rem;
      word-break: break-all; color: var(--success); line-height: 1.5; }
    .empty-info { color: var(--text-dim); font-size: 0.85rem; text-align: center;
      padding: 50px 10px; line-height: 1.8; }
    .empty-info .icon { font-size: 2.5rem; margin-bottom: 8px; }
    .error-msg { background: #2d1b1b; border: 1px solid #5a2020; border-radius: 6px;
      color: #f85149; font-size: 0.78rem; padding: 8px 10px; margin-top: 6px; display: none; }

    /* ── Palette Modal ── */
    .palette-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      z-index: 100; display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .palette-overlay.open { opacity: 1; pointer-events: all; }
    .palette-modal { background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px 24px 18px; max-width: 96vw; max-height: 94vh;
      overflow: auto; box-shadow: 0 24px 80px rgba(0,0,0,0.6); }
    .palette-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .palette-header h2 { font-size: 1rem; font-weight: 700; color: var(--text); }
    .close-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
      color: var(--text-dim); cursor: pointer; font-size: 1.1rem; font-weight: 300;
      width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; }
    .close-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--surface2); }

    .pt-wrap { display: flex; flex-direction: column; gap: 0; }
    .pt-grid {
      display: grid;
      grid-template-columns: repeat(18, 36px);
      grid-template-rows: repeat(7, 42px) 10px repeat(2, 42px);
      gap: 2px;
    }
    .pt-cell {
      border-radius: 4px; cursor: pointer; position: relative;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; transition: transform 0.1s, box-shadow 0.1s;
      border: 1px solid rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .pt-cell:hover { transform: scale(1.15); z-index: 2; box-shadow: 0 4px 16px rgba(0,0,0,0.5); }
    .pt-cell.in-mol {
      box-shadow: 0 0 0 2px var(--accent), 0 0 10px rgba(88,166,255,0.55);
      z-index: 1;
      border-color: var(--accent);
    }
    .pt-cell.in-mol:hover { transform: scale(1.15); z-index: 3; }
    .pt-cell.pt-empty { background: transparent; border: none; cursor: default; pointer-events: none; }
    .pt-cell.pt-placeholder { border-radius: 4px; display: flex; align-items: center;
      justify-content: center; cursor: default; border: 1px dashed var(--border); }
    .pt-no { font-size: 0.55rem; line-height: 1; opacity: 0.75; position: absolute; top: 3px; left: 4px; }
    .pt-sym { font-size: 0.82rem; font-weight: 700; line-height: 1; margin-top: 4px; }

    /* Detail bar */
    .pt-detail-bar { background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px 16px; margin-top: 12px;
      display: flex; align-items: center; gap: 16px; min-height: 64px; }
    .pt-detail-swatch { width: 44px; height: 44px; border-radius: 7px;
      border: 1px solid rgba(255,255,255,0.15); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; font-weight: 700; }
    .pt-detail-main { flex: 1; }
    .pt-detail-name { font-size: 1rem; font-weight: 700; }
    .pt-detail-sub { font-size: 0.75rem; color: var(--text-dim); margin-top: 2px; }
    .pt-detail-stats { display: flex; gap: 18px; flex-shrink: 0; }
    .pt-stat { text-align: center; }
    .pt-stat-val { font-size: 1rem; font-weight: 700; color: var(--accent); }
    .pt-stat-lbl { font-size: 0.65rem; color: var(--text-dim); }

    /* Legend */
    .pt-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; }
    .pt-legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.7rem; color: var(--text-dim); }
    .pt-legend-dot { width: 11px; height: 11px; border-radius: 2px; flex-shrink: 0; }
  </style>
</head>
<body>

<header>
  <h1>⚗️ ChemViz</h1>
  <p>化学式ビジュアライザー</p>
  <button class="palette-toggle" onclick="openPalette()">🎨 元素パレット</button>
</header>

<div class="app">
  <aside class="sidebar">
    <div class="search-box">
      <div class="search-row">
        <input type="text" id="smiles-input" placeholder="分子名 or SMILES を入力…" list="mol-list">
        <button onclick="drawFromInput()">描画</button>
      </div>
      <datalist id="mol-list"></datalist>
      <p class="hint">例: CCO (エタノール), c1ccccc1 (ベンゼン)</p>
      <div class="error-msg" id="error-msg"></div>
    </div>
    <div class="presets" id="presets"></div>
  </aside>

  <main class="canvas-area">
    <div class="canvas-wrapper" id="canvas-wrapper">
      <div class="placeholder" id="placeholder">
        <div class="icon">🧪</div>
        <p>分子を選択するか<br>SMILESを入力してください</p>
      </div>
      <canvas id="mol-canvas"></canvas>
    </div>
    <div class="canvas-controls">
      <button class="ctrl-btn" onclick="zoom(1.25)">＋</button>
      <button class="ctrl-btn" onclick="zoom(0.8)">－</button>
      <button class="ctrl-btn" onclick="resetView()" style="font-size:1rem">⟳</button>
    </div>
    <div class="zoom-hint">スクロール: ズーム ／ ドラッグ: 移動</div>
  </main>

  <aside class="info-panel">
    <div class="empty-info" id="empty-info">
      <div class="icon">📋</div>
      分子を選択すると<br>詳細情報が表示されます
    </div>
    <div id="mol-info" style="display:none">
      <div class="info-section">
        <h3>基本情報</h3>
        <div class="mol-name" id="info-name"></div>
        <div class="mol-formula" id="info-formula"></div>
        <div class="mol-desc" id="info-desc"></div>
      </div>
      <div class="info-section">
        <h3>物性値</h3>
        <div class="stat-grid">
          <div class="stat-card"><div class="stat-label">分子量</div><div class="stat-value" id="info-mw"></div></div>
          <div class="stat-card"><div class="stat-label">分類</div><div class="stat-value" id="info-cat"></div></div>
          <div class="stat-card"><div class="stat-label">元素の種類</div><div class="stat-value" id="info-elems"></div></div>
          <div class="stat-card"><div class="stat-label">総原子数</div><div class="stat-value" id="info-atoms"></div></div>
        </div>
      </div>
      <div class="info-section">
        <h3>元素組成</h3>
        <div class="element-list" id="elem-list"></div>
      </div>
      <div class="info-section">
        <h3>SMILES</h3>
        <div class="smiles-box" id="info-smiles"></div>
      </div>
    </div>
  </aside>
</div>

<!-- Palette Modal -->
<div class="palette-overlay" id="palette-overlay" onclick="handleOverlayClick(event)">
  <div class="palette-modal">
    <div class="palette-header">
      <h2>🎨 元素パレット（全118元素 / Jmol CPKカラー）</h2>
      <button class="close-btn" onclick="closePalette()">✕</button>
    </div>
    <div class="pt-wrap">
      <div class="pt-grid" id="pt-grid"></div>
      <div class="pt-detail-bar" id="pt-detail-bar">
        <div class="pt-detail-swatch" id="pt-swatch" style="background:#21262d;color:#8b949e">?</div>
        <div class="pt-detail-main">
          <div class="pt-detail-name" id="pt-dname">元素にマウスを重ねると詳細が表示されます</div>
          <div class="pt-detail-sub" id="pt-dsub"></div>
        </div>
        <div class="pt-detail-stats" id="pt-dstats" style="display:none">
          <div class="pt-stat"><div class="pt-stat-val" id="pt-dno"></div><div class="pt-stat-lbl">原子番号</div></div>
          <div class="pt-stat"><div class="pt-stat-val" id="pt-dwt"></div><div class="pt-stat-lbl">原子量</div></div>
        </div>
      </div>
      <div class="pt-legend" id="pt-legend"></div>
    </div>
  </div>
</div>

// ── Periodic table ────────────────────────────────────────────────────────────
function buildPeriodicTable() {
  const grid = document.getElementById('pt-grid');
  const byPos = {};
  ALL_ELEMENTS.forEach(e => { byPos[`${e.row},${e.col}`] = e; });

  // Rows 1–7: main table
  for (let r = 1; r <= 7; r++) {
    for (let c = 1; c <= 18; c++) {
      const el = byPos[`${r},${c}`];
      const cell = document.createElement('div');
      cell.style.gridRow = r;
      cell.style.gridColumn = c;

      if ((r === 6 && c === 3) || (r === 7 && c === 3)) {
        cell.className = 'pt-cell pt-placeholder';
        cell.style.background = '#1a2030';
        cell.style.color = '#8b949e';
        cell.style.fontSize = '0.55rem';
        cell.textContent = r === 6 ? '57–71' : '89–103';
      } else if (el) {
        makeCell(cell, el);
      } else {
        cell.className = 'pt-cell pt-empty';
      }
      grid.appendChild(cell);
    }
  }

  // Gap row (row 8 in grid = 10px via template)
  const gap = document.createElement('div');
  gap.style.gridRow = 8; gap.style.gridColumn = '1/19';
  grid.appendChild(gap);

  // Lanthanoids (grid row 9) and Actinoids (grid row 10)
  for (let r = 9; r <= 10; r++) {
    // Label in col 1
    const lbl = document.createElement('div');
    lbl.style.gridRow = r; lbl.style.gridColumn = '1/3';
    lbl.style.display = 'flex'; lbl.style.alignItems = 'center';
    lbl.style.justifyContent = 'center';
    lbl.style.fontSize = '0.55rem'; lbl.style.color = '#8b949e';
    lbl.textContent = r === 9 ? 'ランタノイド' : 'アクチノイド';
    grid.appendChild(lbl);

    for (let c = 3; c <= 17; c++) {
      const el = byPos[`${r},${c}`];
      if (!el) continue;
      const cell = document.createElement('div');
      cell.style.gridRow = r; cell.style.gridColumn = c;
      makeCell(cell, el);
      grid.appendChild(cell);
    }
  }
}

function makeCell(cell, el) {
  cell.className = 'pt-cell';
  cell.dataset.sym = el.sym;
  const lum = hexLum(el.color);
  cell.style.background = el.color;
  cell.style.color = lum > 0.42 ? '#111' : '#eee';
  cell.innerHTML = `<span class="pt-no">${el.no}</span><span class="pt-sym">${el.sym}</span>`;
  cell.addEventListener('mouseenter', () => showElemDetail(el));
  cell.addEventListener('click', () => showElemDetail(el));
}

function buildLegend() {
  const leg = document.getElementById('pt-legend');
  for (const [key, val] of Object.entries(CAT_LABELS)) {
    const item = document.createElement('div');
    item.className = 'pt-legend-item';
    item.innerHTML = `<div class="pt-legend-dot" style="background:${val.color}"></div>${val.ja}`;
    leg.appendChild(item);
  }
}

function showElemDetail(el) {
  const lum = hexLum(el.color);
  document.getElementById('pt-swatch').style.background = el.color;
  document.getElementById('pt-swatch').style.color = lum > 0.42 ? '#111' : '#eee';
  document.getElementById('pt-swatch').textContent = el.sym;
  document.getElementById('pt-dname').textContent = `${el.sym}  ${el.ja}`;
  document.getElementById('pt-dsub').textContent =
    `${CAT_LABELS[el.cat]?.ja ?? el.cat}　／　Jmol CPK カラー: ${el.color.toUpperCase()}`;
  document.getElementById('pt-dno').textContent = el.no;
  document.getElementById('pt-dwt').textContent = el.wt;
  document.getElementById('pt-dstats').style.display = 'flex';
}

function openPalette() {
  document.getElementById('palette-overlay').classList.add('open');
  highlightMolElements();
}
function closePalette() {
  document.getElementById('palette-overlay').classList.remove('open');
}
function handleOverlayClick(e) {
  if (e.target === document.getElementById('palette-overlay')) closePalette();
}

function highlightMolElements() {
  document.querySelectorAll('.pt-cell').forEach(c => c.classList.remove('in-mol'));
  for (const sym of Object.keys(currentComp)) {
    document.querySelectorAll(`.pt-cell[data-sym="${sym}"]`).forEach(c => c.classList.add('in-mol'));
  }
}

  for (const cat of CATEGORIES) {
    const lbl = document.createElement('div');
    lbl.className = 'cat-label'; lbl.textContent = cat.label;
    container.appendChild(lbl);
    const grid = document.createElement('div');
    grid.className = 'mol-grid';
    for (const mol of cat.items) {
      const btn = document.createElement('button');
      btn.className = 'mol-btn'; btn.textContent = mol.name; btn.dataset.name = mol.name;
      btn.addEventListener('click', () => loadMolecule(mol, btn));
      grid.appendChild(btn);
      const opt = document.createElement('option'); opt.value = mol.name;
      datalist.appendChild(opt);
    }
    container.appendChild(grid);
  }
}

// ── Canvas interaction ────────────────────────────────────────────────────────
function setupInteraction() {
  const wrapper = document.getElementById('canvas-wrapper');
  wrapper.addEventListener('wheel', e => {
    e.preventDefault();
    scale = Math.max(0.15, Math.min(10, scale * (e.deltaY > 0 ? 0.85 : 1.18)));
    applyTransform();
  }, { passive: false });
  wrapper.addEventListener('mousedown', e => { dragging=true; lastMX=e.clientX; lastMY=e.clientY; });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    tx+=e.clientX-lastMX; ty+=e.clientY-lastMY;
    lastMX=e.clientX; lastMY=e.clientY; applyTransform();
  });
  window.addEventListener('mouseup', () => { dragging=false; });
  let lastPinch=null;
  wrapper.addEventListener('touchstart', e => {
    if(e.touches.length===1){dragging=true;lastMX=e.touches[0].clientX;lastMY=e.touches[0].clientY;}
  });
  wrapper.addEventListener('touchmove', e => {
    e.preventDefault();
    if(e.touches.length===1&&dragging){
      tx+=e.touches[0].clientX-lastMX;ty+=e.touches[0].clientY-lastMY;
      lastMX=e.touches[0].clientX;lastMY=e.touches[0].clientY;applyTransform();
    } else if(e.touches.length===2){
      const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      if(lastPinch){scale=Math.max(0.15,Math.min(10,scale*d/lastPinch));applyTransform();}
      lastPinch=d;
    }
  },{passive:false});
  wrapper.addEventListener('touchend',()=>{dragging=false;lastPinch=null;});
}

function applyTransform() {
  document.getElementById('mol-canvas').style.transform =
    `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(${scale})`;
}
function zoom(f){scale=Math.max(0.15,Math.min(10,scale*f));applyTransform();}
function resetView(){scale=1;tx=0;ty=0;applyTransform();}

// ── Draw ──────────────────────────────────────────────────────────────────────
function loadMolecule(mol, btn) {
  document.querySelectorAll('.mol-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  document.getElementById('smiles-input').value = mol.smiles;
  hideError();
  renderSmiles(mol.smiles, ()=>updatePanel(mol));
}

function drawFromInput() {
  const raw = document.getElementById('smiles-input').value.trim();
  if(!raw) return;
  hideError();
  for(const cat of CATEGORIES){
    const found = cat.items.find(m=>m.name===raw);
    if(found){ loadMolecule(found, document.querySelector(`[data-name="${found.name}"]`)); return; }
  }
  document.querySelectorAll('.mol-btn').forEach(b=>b.classList.remove('active'));
  const custom = {name:'カスタム',formula:derivePlainFormula(raw),smiles:raw,mw:null,cat:'SMILES入力',desc:'ユーザー入力のSMILES文字列'};
  renderSmiles(raw, ()=>updatePanel(custom));
}

function renderSmiles(smiles, onSuccess) {
  SmilesDrawer.parse(smiles, tree => {
    const c = document.getElementById('mol-canvas');
    c.width=CANVAS_W; c.height=CANVAS_H; c.style.display='block';
    document.getElementById('placeholder').style.display='none';
    resetView();
    drawer.draw(tree,'mol-canvas','dark',false);
    if(onSuccess) onSuccess();
  }, err => showError('解析エラー: '+(err||'無効なSMILES')));
}

// ── Info panel ────────────────────────────────────────────────────────────────
function updatePanel(mol) {
  document.getElementById('empty-info').style.display='none';
  document.getElementById('mol-info').style.display='block';
  document.getElementById('info-name').textContent   = mol.name;
  document.getElementById('info-formula').innerHTML  = fmtFormula(mol.formula||'—');
  document.getElementById('info-desc').textContent   = mol.desc||'—';
  document.getElementById('info-mw').textContent     = mol.mw ? mol.mw+' g/mol' : '—';
  document.getElementById('info-cat').textContent    = mol.cat||'—';
  document.getElementById('info-smiles').textContent = mol.smiles;
  currentComp = parseFormula(mol.formula||'');
  const types = Object.keys(currentComp).length;
  const total = Object.values(currentComp).reduce((s,n)=>s+n,0);
  document.getElementById('info-elems').textContent = types ? types+' 種' : '—';
  document.getElementById('info-atoms').textContent = total ? total+' 個' : '—';
  renderElemList(currentComp);
}

function renderElemList(comp) {
  const list = document.getElementById('elem-list');
  list.innerHTML = '';
  const order = ['C','H'];
  const keys = Object.keys(comp).sort((a,b)=>{
    const ia=order.indexOf(a),ib=order.indexOf(b);
    if(ia>=0&&ib>=0)return ia-ib; if(ia>=0)return -1; if(ib>=0)return 1;
    return a.localeCompare(b);
  });
  for(const sym of keys){
    const count=comp[sym], el=ELEM_MAP[sym];
    const color=el?el.color:'#666', lum=hexLum(color);
    const item=document.createElement('div');
    item.className='element-item';
    item.innerHTML=`
      <div class="elem-badge" style="background:${color};color:${lum>0.42?'#111':'#eee'}">${sym}</div>
      <div class="elem-info">
        <div class="elem-name">${el?el.ja:sym}</div>
        <div class="elem-detail">${el?`原子番号 ${el.no} · ${el.wt} g/mol`:''}</div>
      </div>
      <div class="elem-count">×${count}</div>`;
    list.appendChild(item);
  }
  if(!keys.length) list.innerHTML='<div style="color:var(--text-dim);font-size:.8rem">組成情報なし</div>';
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function fmtFormula(f){ return f.replace(/(\d+)/g,'<sub>$1</sub>'); }
function parseFormula(f){
  const elems={}, re=/([A-Z][a-z]?)(\d*)/g; let m;
  while((m=re.exec(f))!==null) if(m[1]) elems[m[1]]=(elems[m[1]]||0)+(parseInt(m[2])||1);
  return elems;
}
function derivePlainFormula(smiles){
  const counts={}, re=/\[([A-Z][a-z]?)[\d@H+-]*\]|([A-Z][a-z]?)/g; let m;
  while((m=re.exec(smiles))!==null){const s=m[1]||m[2];if(s&&s!=='R')counts[s]=(counts[s]||0)+1;}
  return Object.entries(counts).map(([s,n])=>s+(n>1?n:'')).join('');
}
function hexLum(hex){
  const r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
  return 0.299*r+0.587*g+0.114*b;
}
function showError(msg){const el=document.getElementById('error-msg');el.textContent=msg;el.style.display='block';}
function hideError(){document.getElementById('error-msg').style.display='none';}
</script>
