<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MarketScope Pro v4</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Noto+Sans+JP:wght@300;400;500;700&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0d0d0f;
  --ink2:#3d3d42;
  --ink3:#7a7a85;
  --paper:#f7f6f3;
  --paper2:#eeede9;
  --paper3:#e4e3de;
  --accent:#e85d26;
  --accent2:#f0a500;
  --green:#1a7f5a;
  --red:#c0392b;
  --blue:#1a4fa0;
  --bd:1px solid #d8d7d2;
  --bd2:1px solid #c8c7c2;
  --r:6px;
  --shadow:0 2px 12px rgba(13,13,15,.08);
  --shadow-lg:0 8px 32px rgba(13,13,15,.14);
}
html,body{height:100%;background:var(--paper);font-family:'Noto Sans JP',sans-serif;font-size:13px;color:var(--ink);line-height:1.5}

/* ── HEADER ── */
#hdr{
  height:52px;display:flex;align-items:center;padding:0 16px;gap:14px;
  background:var(--ink);border-bottom:2px solid var(--accent);
  flex-shrink:0;position:relative;z-index:200;
}
.logo{
  font-family:'Syne',sans-serif;font-size:17px;font-weight:800;
  color:#fff;letter-spacing:-.5px;white-space:nowrap;display:flex;align-items:center;gap:6px;
}
.logo-dot{width:8px;height:8px;background:var(--accent);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(1.3)}}
.logo-sub{font-size:10px;font-weight:400;color:#9a9a9f;letter-spacing:.5px;font-family:'Noto Sans JP',sans-serif}

.genre-bar{display:flex;gap:4px;flex-wrap:wrap;margin-left:4px}
.gbtn{
  padding:4px 10px;border-radius:3px;cursor:pointer;font-size:11px;font-weight:500;
  background:transparent;border:1px solid #3a3a40;color:#9a9a9f;
  transition:all .15s;white-space:nowrap;font-family:'Noto Sans JP',sans-serif;
}
.gbtn:hover{border-color:#6a6a70;color:#ccc}
.gbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}

.hstats{margin-left:auto;display:flex;gap:20px;flex-shrink:0}
.hstat-v{font-family:'Syne',sans-serif;font-size:19px;font-weight:700;color:#fff;line-height:1;cursor:pointer}
.hstat-v:hover{color:var(--accent)}
.hstat-l{font-size:9px;color:#6a6a70;margin-top:1px;letter-spacing:.5px}

/* ── LAYOUT ── */
#body{flex:1;display:flex;min-height:0;height:calc(100vh - 52px)}

/* ── LEFT PANEL ── */
#left{
  width:268px;flex-shrink:0;border-right:var(--bd2);
  overflow-y:auto;background:var(--paper);display:flex;flex-direction:column;
}
#left::-webkit-scrollbar{width:4px}
#left::-webkit-scrollbar-thumb{background:var(--paper3);border-radius:2px}

/* search area */
.search-area{padding:12px 14px;border-bottom:var(--bd);background:var(--paper2)}
.search-label{font-size:10px;font-weight:700;letter-spacing:.8px;color:var(--ink3);margin-bottom:5px;text-transform:uppercase}
.addr-row{display:flex;gap:6px}
.addr-input{
  flex:1;padding:7px 10px;border:var(--bd2);border-radius:var(--r);
  background:#fff;font-size:12px;font-family:'Noto Sans JP',sans-serif;color:var(--ink);
  transition:border-color .15s;outline:none;
}
.addr-input:focus{border-color:var(--accent)}
.addr-btn{
  padding:7px 10px;background:var(--accent);color:#fff;border:none;border-radius:var(--r);
  cursor:pointer;font-size:11px;font-weight:700;white-space:nowrap;
  font-family:'Noto Sans JP',sans-serif;transition:opacity .15s;
}
.addr-btn:hover{opacity:.85}

/* panel tabs */
.ptabs{display:flex;border-bottom:var(--bd);flex-shrink:0;background:var(--paper2)}
.ptab{
  flex:1;padding:9px 0;text-align:center;cursor:pointer;font-size:11px;font-weight:700;
  color:var(--ink3);border-bottom:2px solid transparent;transition:all .15s;letter-spacing:.3px;
}
.ptab.on{color:var(--accent);border-bottom-color:var(--accent);background:var(--paper)}

/* section header */
.sec-hd{
  padding:10px 14px 6px;font-family:'Syne',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:1px;color:var(--ink3);text-transform:uppercase;
  border-bottom:var(--bd);background:var(--paper2);
}

/* category group */
.cat-group{border-bottom:var(--bd)}
.cat-hd{
  padding:9px 14px;font-size:11px;font-weight:700;color:var(--ink2);
  cursor:pointer;display:flex;align-items:center;justify-content:space-between;
  background:var(--paper);transition:background .1s;
}
.cat-hd:hover{background:var(--paper2)}
.cat-hd-left{display:flex;align-items:center;gap:7px}
.cat-badge{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;
}
.cat-arrow{font-size:9px;color:var(--ink3);transition:transform .2s}
.cat-arrow.open{transform:rotate(90deg)}
.cat-body{display:none;padding:6px 0 10px}
.cat-body.open{display:block}

/* slider item */
.sl-item{padding:5px 14px}
.sl-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.sl-name{font-size:11px;color:var(--ink2)}
.sl-badge{
  font-size:9px;padding:1px 5px;border-radius:2px;font-weight:700;
  background:var(--paper3);color:var(--ink3);
}
.sl-badge.new{background:#fff0e8;color:var(--accent)}
.sl-val{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:var(--ink);min-width:24px;text-align:right}
.sl-track{position:relative;height:4px;background:var(--paper3);border-radius:2px;cursor:pointer}
.sl-fill{height:100%;border-radius:2px;background:var(--accent);transition:width .1s}
input[type=range]{
  position:absolute;top:-6px;left:0;width:100%;height:16px;
  opacity:0;cursor:pointer;
}

/* preset */
.preset-area{padding:8px 14px;border-bottom:var(--bd)}
.preset-label{font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--ink3);margin-bottom:5px}
.preset-btns{display:flex;flex-wrap:wrap;gap:4px}
.pbtn{
  padding:3px 8px;border:var(--bd2);border-radius:3px;cursor:pointer;font-size:10px;
  background:#fff;color:var(--ink2);transition:all .15s;font-family:'Noto Sans JP',sans-serif;
}
.pbtn:hover{border-color:var(--accent);color:var(--accent)}
.pbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* ranking list */
.rank-list{padding:8px 0}
.rank-item{
  display:flex;align-items:center;gap:10px;padding:8px 14px;
  cursor:pointer;transition:background .1s;border-left:3px solid transparent;
}
.rank-item:hover{background:var(--paper2)}
.rank-item.selected{background:#fff0e8;border-left-color:var(--accent)}
.rank-num{
  font-family:'Syne',sans-serif;font-size:14px;font-weight:800;
  color:var(--paper3);min-width:20px;text-align:center;
}
.rank-num.t1{color:var(--accent)}
.rank-num.t2{color:var(--accent2)}
.rank-num.t3{color:var(--ink3)}
.rank-body{flex:1;min-width:0}
.rank-name{font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-sub{font-size:10px;color:var(--ink3);margin-top:1px}
.rank-score-wrap{text-align:right;flex-shrink:0}
.rank-score{
  font-family:'Syne',sans-serif;font-size:16px;font-weight:800;
  display:block;
}
.score-bar-mini{height:3px;background:var(--paper3);border-radius:2px;margin-top:3px;width:48px}
.score-bar-mini-fill{height:100%;border-radius:2px;transition:width .3s}

/* ── MAP ── */
#map-wrap{flex:1;position:relative;min-width:0}
#map{width:100%;height:100%}

/* ── RIGHT PANEL ── */
#right{
  width:292px;flex-shrink:0;border-left:var(--bd2);
  overflow-y:auto;background:var(--paper);display:flex;flex-direction:column;
}
#right::-webkit-scrollbar{width:4px}
#right::-webkit-scrollbar-thumb{background:var(--paper3);border-radius:2px}

.rpanel-hd{
  padding:14px 16px 10px;border-bottom:var(--bd);background:var(--paper2);flex-shrink:0;
}
.rpanel-title{
  font-family:'Syne',sans-serif;font-size:13px;font-weight:800;color:var(--ink);
  letter-spacing:-.3px;
}
.rpanel-loc{font-size:11px;color:var(--ink3);margin-top:3px}

/* total score */
.total-score-wrap{
  margin:14px 16px;padding:16px;background:var(--ink);border-radius:var(--r);
  text-align:center;position:relative;overflow:hidden;
}
.total-score-wrap::before{
  content:'';position:absolute;top:-20px;right:-20px;
  width:80px;height:80px;background:var(--accent);opacity:.12;border-radius:50%;
}
.ts-label{font-size:10px;font-weight:700;letter-spacing:.8px;color:#6a6a70;text-transform:uppercase}
.ts-val{
  font-family:'Syne',sans-serif;font-size:52px;font-weight:800;color:#fff;
  line-height:1;margin:4px 0 2px;
}
.ts-grade{font-size:12px;font-weight:700;letter-spacing:.5px}
.ts-bar{height:5px;background:#2a2a30;border-radius:3px;margin-top:10px}
.ts-bar-fill{height:100%;border-radius:3px;transition:width .6s cubic-bezier(.34,1.56,.64,1)}

/* radar chart */
.radar-wrap{padding:12px 16px 14px;border-bottom:var(--bd);text-align:center}
.radar-title{
  font-family:'Syne',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:1px;color:var(--ink3);text-transform:uppercase;margin-bottom:8px;
}

/* dimension scores */
.dim-section{padding:0 16px 10px;border-bottom:var(--bd)}
.dim-title{
  font-family:'Syne',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:1px;color:var(--ink3);text-transform:uppercase;margin:12px 0 8px;
}
.dim-item{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.dim-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dim-name{font-size:11px;color:var(--ink2);flex:1}
.dim-bar-wrap{width:70px;height:5px;background:var(--paper3);border-radius:3px;flex-shrink:0}
.dim-bar-fill{height:100%;border-radius:3px;transition:width .5s}
.dim-score{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:var(--ink);min-width:26px;text-align:right}

/* indicator detail */
.ind-section{padding:0 16px 14px}
.ind-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.ind-card{
  background:#fff;border:var(--bd);border-radius:var(--r);padding:9px 10px;
  transition:box-shadow .15s;
}
.ind-card:hover{box-shadow:var(--shadow)}
.ind-card.new-ind{border-color:var(--accent);background:#fff8f5}
.ind-card-label{font-size:9px;font-weight:700;color:var(--ink3);letter-spacing:.3px;line-height:1.3}
.ind-card-val{
  font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:var(--ink);
  margin:4px 0 2px;line-height:1;
}
.ind-card-bar{height:3px;background:var(--paper3);border-radius:2px}
.ind-card-bar-fill{height:100%;border-radius:2px;transition:width .5s}
.ind-new-tag{
  font-size:8px;font-weight:700;color:var(--accent);letter-spacing:.5px;margin-bottom:2px;
}

/* save button */
.save-wrap{padding:14px 16px;border-top:var(--bd);background:var(--paper2);margin-top:auto;flex-shrink:0}
.save-btn{
  width:100%;padding:10px;background:var(--ink);color:#fff;border:none;border-radius:var(--r);
  cursor:pointer;font-size:12px;font-weight:700;font-family:'Noto Sans JP',sans-serif;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:background .15s;
}
.save-btn:hover{background:var(--accent)}
.save-count{
  font-size:10px;color:var(--ink3);text-align:center;margin-top:6px;
  cursor:pointer;transition:color .15s;
}
.save-count:hover{color:var(--accent)}

/* map overlay */
.map-search-overlay{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);
  background:#fff;border-radius:6px;box-shadow:var(--shadow-lg);
  padding:10px 14px;font-size:11px;color:var(--ink3);z-index:100;
  pointer-events:none;border-left:3px solid var(--accent);
}
.legend-box{
  position:absolute;bottom:14px;left:14px;background:#fff;border-radius:6px;
  box-shadow:var(--shadow-lg);padding:10px 12px;z-index:100;border:var(--bd);
}
.leg-title{font-size:9px;font-weight:700;letter-spacing:.8px;color:var(--ink3);margin-bottom:6px;text-transform:uppercase}
.leg-item{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.leg-dot{width:10px;height:10px;border-radius:50%;border:2px solid rgba(255,255,255,.8)}
.leg-label{font-size:10px;color:var(--ink2)}

/* tooltip */
.leaflet-tooltip{
  background:var(--ink)!important;color:#fff!important;border:none!important;
  border-radius:4px!important;font-family:'Noto Sans JP',sans-serif!important;
  font-size:11px!important;padding:5px 9px!important;box-shadow:var(--shadow)!important;
}
.leaflet-tooltip::before{border-top-color:var(--ink)!important}

/* tag */
.new-tag{
  display:inline-block;font-size:8px;font-weight:700;letter-spacing:.5px;
  background:var(--accent);color:#fff;padding:1px 4px;border-radius:2px;margin-left:4px;
  vertical-align:middle;
}

/* ── SAVED MODAL ── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(13,13,15,.65);z-index:1000;
  display:none;align-items:center;justify-content:center;padding:16px;
}
.modal-overlay.open{display:flex}
.modal-box{
  background:var(--paper);border-radius:10px;width:680px;max-width:100%;
  max-height:85vh;display:flex;flex-direction:column;
  box-shadow:var(--shadow-lg);border:var(--bd2);
}
.modal-hd{
  padding:14px 18px;border-bottom:var(--bd);background:var(--paper2);
  border-radius:10px 10px 0 0;display:flex;align-items:center;
  justify-content:space-between;flex-shrink:0;
}
.modal-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:800;color:var(--ink)}
.modal-close{
  width:30px;height:30px;border:none;background:var(--paper3);border-radius:4px;
  cursor:pointer;font-size:18px;color:var(--ink3);display:flex;align-items:center;
  justify-content:center;line-height:1;transition:background .15s;
}
.modal-close:hover{background:var(--red);color:#fff}
.modal-body{overflow-y:auto;flex:1}
.modal-body::-webkit-scrollbar{width:4px}
.modal-body::-webkit-scrollbar-thumb{background:var(--paper3);border-radius:2px}
.modal-footer{
  padding:12px 18px;border-top:var(--bd);background:var(--paper2);
  border-radius:0 0 10px 10px;display:flex;gap:8px;
  justify-content:space-between;align-items:center;flex-shrink:0;
}
.modal-footer-left{font-size:11px;color:var(--ink3)}
.modal-btns{display:flex;gap:8px}
.modal-empty{padding:48px;text-align:center;color:var(--ink3);font-size:12px}
.save-item{
  display:flex;align-items:center;gap:14px;padding:12px 18px;
  border-bottom:var(--bd);transition:background .1s;
}
.save-item:hover{background:var(--paper2)}
.save-item-score{
  font-family:'Syne',sans-serif;font-size:24px;font-weight:800;
  min-width:42px;text-align:center;flex-shrink:0;
}
.save-item-body{flex:1;min-width:0}
.save-item-name{font-size:12px;font-weight:700;color:var(--ink)}
.save-item-genre{font-size:10px;font-weight:400;color:var(--ink3);margin-left:4px}
.save-item-meta{font-size:10px;color:var(--ink3);margin-top:3px}
.save-item-cats{font-size:10px;color:var(--ink3);margin-top:2px}
.save-del{
  padding:5px 10px;border:var(--bd2);border-radius:3px;background:transparent;
  cursor:pointer;font-size:10px;color:var(--ink3);font-family:'Noto Sans JP',sans-serif;
  transition:all .15s;flex-shrink:0;white-space:nowrap;
}
.save-del:hover{border-color:var(--red);color:var(--red);background:#fff5f5}
.exp-btn{
  padding:8px 14px;color:#fff;border:none;border-radius:var(--r);
  cursor:pointer;font-size:11px;font-weight:700;
  font-family:'Noto Sans JP',sans-serif;transition:opacity .15s;
}
.exp-btn:hover{opacity:.82}
.clear-btn{
  padding:6px 12px;border:var(--bd2);border-radius:var(--r);background:transparent;
  cursor:pointer;font-size:11px;color:var(--ink3);font-family:'Noto Sans JP',sans-serif;
  transition:all .15s;
}
.clear-btn:hover{border-color:var(--red);color:var(--red)}
</style>
</head>
<body>
<div id="app" style="height:100vh;display:flex;flex-direction:column">

<!-- HEADER -->
<div id="hdr">
  <div class="logo">
    <div class="logo-dot"></div>
    <div>
      MarketScope <span style="color:var(--accent)">Pro</span>
      <div class="logo-sub">立地インテリジェンス・プラットフォーム</div>
    </div>
  </div>

  <div class="genre-bar" id="genreBar"></div>

  <div class="hstats">
    <div>
      <div class="hstat-v" id="hSave" onclick="openSavedModal()" title="保存一覧を見る">0</div>
      <div class="hstat-l">SAVED</div>
    </div>
    <div>
      <div class="hstat-v" id="hTop" style="color:var(--accent)">—</div>
      <div class="hstat-l">TOP SCORE</div>
    </div>
  </div>
</div>

<!-- BODY -->
<div id="body">

  <!-- LEFT -->
  <div id="left">
    <!-- 住所検索 -->
    <div class="search-area">
      <div class="search-label">エリア検索</div>
      <div class="addr-row">
        <input class="addr-input" id="addrInput" type="text" placeholder="住所・駅名を入力（例：梅田、渋谷）">
        <button class="addr-btn" onclick="searchAddress()">検索</button>
      </div>
    </div>

    <!-- パネルタブ -->
    <div class="ptabs">
      <div class="ptab on" id="ptW" onclick="switchPanel('w')">重みづけ</div>
      <div class="ptab" id="ptR" onclick="switchPanel('r')">ランキング</div>
    </div>

    <!-- 重みづけパネル -->
    <div id="wPanel">
      <!-- プリセット -->
      <div class="preset-area">
        <div class="preset-label">プリセット適用</div>
        <div class="preset-btns" id="presetBtns"></div>
      </div>

      <!-- スライダー群 -->
      <div id="sliderGroups"></div>
    </div>

    <!-- ランキングパネル -->
    <div id="rPanel" style="display:none">
      <div class="sec-hd">スコアランキング</div>
      <div class="rank-list" id="rankList"></div>
    </div>
  </div>

  <!-- MAP -->
  <div id="map-wrap">
    <div id="map"></div>
    <div class="map-search-overlay" id="mapHint">地図上のエリアをクリックして分析 / 住所で検索</div>
    <div class="legend-box">
      <div class="leg-title">スコア凡例</div>
      <div class="leg-item"><div class="leg-dot" style="background:#e85d26"></div><div class="leg-label">80以上（優良）</div></div>
      <div class="leg-item"><div class="leg-dot" style="background:#f0a500"></div><div class="leg-label">60〜79（良好）</div></div>
      <div class="leg-item"><div class="leg-dot" style="background:#1a4fa0"></div><div class="leg-label">40〜59（普通）</div></div>
      <div class="leg-item"><div class="leg-dot" style="background:#6a6a70"></div><div class="leg-label">39以下（要注意）</div></div>
    </div>
  </div>

  <!-- RIGHT -->
  <div id="right">
    <div class="rpanel-hd">
      <div class="rpanel-title" id="rpTitle">エリアを選択してください</div>
      <div class="rpanel-loc" id="rpLoc">地図またはランキングから選択</div>
    </div>

    <div id="rpContent" style="display:none">
      <!-- トータルスコア -->
      <div class="total-score-wrap">
        <div class="ts-label">TOTAL SCORE</div>
        <div class="ts-val" id="tsVal">—</div>
        <div class="ts-grade" id="tsGrade">—</div>
        <div class="ts-bar"><div class="ts-bar-fill" id="tsBarFill" style="width:0"></div></div>
      </div>

      <!-- レーダーチャート -->
      <div class="radar-wrap">
        <div class="radar-title">4次元バランス</div>
        <div id="radarChart"></div>
      </div>

      <!-- 4次元スコア -->
      <div class="dim-section">
        <div class="dim-title">スコア内訳</div>
        <div id="dimScores"></div>
      </div>

      <!-- 指標詳細 -->
      <div class="ind-section">
        <div class="dim-title">指標詳細</div>
        <div class="ind-grid" id="indGrid"></div>
      </div>
    </div>

    <div class="save-wrap">
      <button class="save-btn" id="saveBtn" onclick="saveAnalysis()">
        <span>📌</span> この分析を保存
      </button>

  rival_count:'high', rival_review:'low', rival_score:'low', chain_ratio:'low',
  rent:'low', vacancy:'mid', station:'high',

// ============================================================
// SCORE CALCULATION
// ============================================================

function normalize(metric, value) {
  const vals = AREAS.map(a => a.data[metric]);
  const min = Math.min(...vals), max = Math.max(...vals);
  if (max === min) return 50;
  const dir = SCORE_DIR[metric];
  if (dir === 'high') return Math.round((value - min) / (max - min) * 100);
  if (dir === 'low')  return Math.round((1 - (value - min) / (max - min)) * 100);
  if (dir === 'mid')  return Math.round(Math.max(0, 100 - Math.abs(value - 10) * 5));
  return 50;
}

function calcScore(area) {
  let weightedSum = 0, weightTotal = 0;
  ALL_ITEMS.forEach(item => {
    const w = weights[item.id] || 0;
    const norm = normalize(item.id, area.data[item.id]);
    weightedSum += norm * w;
    weightTotal += w * 100;
  });
  return weightTotal > 0 ? Math.round(weightedSum / weightTotal * 100) : 0;
}

function calcCatScores(area) {
  return CATEGORIES.map(cat => {
    let ws = 0, wt = 0;
    cat.items.forEach(item => {
      const w = weights[item.id] || 0;
      const norm = normalize(item.id, area.data[item.id]);
      ws += norm * w; wt += w * 100;
    });
    return {cat, score: wt > 0 ? Math.round(ws / wt * 100) : 0};
  });
}

function gradeInfo(score) {
  if (score >= 80) return {label:'◎ 優良',   color:'#e85d26'};
  if (score >= 65) return {label:'○ 良好',   color:'#f0a500'};
  if (score >= 50) return {label:'△ 普通',   color:'#1a4fa0'};
  return              {label:'✕ 要注意', color:'#7a7a85'};
}

function markerColor(score) {
  if (score >= 80) return '#e85d26';
  if (score >= 60) return '#f0a500';
  if (score >= 40) return '#1a4fa0';
  return '#6a6a70';
}

// ============================================================
// RADAR CHART (SVG)
// ============================================================

function renderRadarChart(catScores) {
  const S = 196, C = 98, R = 64, LR = R + 20;
  const n = catScores.length;
  const angles = catScores.map((_, i) => (i * 2 * Math.PI / n) - Math.PI / 2);

  let svg = '';

  // Background grid rings
  [25, 50, 75, 100].forEach(lv => {
    const r = R * lv / 100;
    const pts = angles.map(a =>
      `${(C + r * Math.cos(a)).toFixed(2)},${(C + r * Math.sin(a)).toFixed(2)}`
    ).join(' ');
    const isOuter = lv === 100;
    svg += `<polygon points="${pts}" fill="${isOuter ? 'none' : 'rgba(228,227,222,0.4)'}" stroke="#d8d7d2" stroke-width="${isOuter ? 1.5 : 1}"/>`;
  });

  // Axis lines
  angles.forEach(a => {
    const x2 = (C + R * Math.cos(a)).toFixed(2);
    const y2 = (C + R * Math.sin(a)).toFixed(2);
    svg += `<line x1="${C}" y1="${C}" x2="${x2}" y2="${y2}" stroke="#d8d7d2" stroke-width="1"/>`;
  });

  // Data polygon
  const dataPts = catScores.map(({score}, i) => {
    const r = R * Math.max(score, 2) / 100;
    return `${(C + r * Math.cos(angles[i])).toFixed(2)},${(C + r * Math.sin(angles[i])).toFixed(2)}`;
  }).join(' ');
  svg += `<polygon points="${dataPts}" fill="rgba(232,93,38,0.18)" stroke="#e85d26" stroke-width="2.5" stroke-linejoin="round"/>`;

  // Data dots + labels
  catScores.forEach(({cat, score}, i) => {
    const r = R * Math.max(score, 2) / 100;
    const dx = (C + r * Math.cos(angles[i])).toFixed(2);
    const dy = (C + r * Math.sin(angles[i])).toFixed(2);
    svg += `<circle cx="${dx}" cy="${dy}" r="5" fill="${cat.color}" stroke="#fff" stroke-width="2"/>`;

    const lx = (C + LR * Math.cos(angles[i])).toFixed(2);
    const ly = (C + LR * Math.sin(angles[i])).toFixed(2);
    svg += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle"
      font-size="9" font-family="'Noto Sans JP',sans-serif" font-weight="700"
      fill="${cat.color}">${cat.label}</text>`;
  });

  // Center dot
  svg += `<circle cx="${C}" cy="${C}" r="3" fill="#d8d7d2"/>`;

  return `<svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}" style="display:block;margin:0 auto">${svg}</svg>`;
}

function renderMap() {
  if (!map) {
    map = L.map('map', {zoomControl:true}).setView([34.693, 135.502], 13);

  markers = {};

    const score = calcScore(area);
    const color = markerColor(score);
    const icon = L.divIcon({
      className:'',
      html:`<div style="

      iconSize:[42,42], iconAnchor:[21,21]

      .bindTooltip(area.name, {permanent:false, direction:'top'})

    markers[area.id] = m;

function renderRightPanel(areaId) {

        <div class="ind-card-bar-fill" style="width:${norm}%;background:${catColor}"></div>

function formatVal(item, val) {
  if (item.id === 'rival_score') return val.toFixed(1);
  if (Number.isInteger(val)) return val.toLocaleString();
  if (val < 10) return val.toFixed(1);
  return Math.round(val).toLocaleString();
}

    const score = calcScore(AREAS.find(a=>a.id===aid));
    const color = aid === id ? '#e85d26' : markerColor(score);
    const icon = L.divIcon({
      className:'',
      html:`<div style="
        width:${aid===id?50:42}px;height:${aid===id?50:42}px;border-radius:50%;
        background:${color};color:#fff;
        display:flex;align-items:center;justify-content:center;
        font-family:Syne,sans-serif;font-size:${aid===id?15:13}px;font-weight:800;
        box-shadow:${aid===id?'0 4px 16px rgba(232,93,38,.5)':'0 3px 10px rgba(0,0,0,.25)'};
        border:3px solid #fff;cursor:pointer;
      ">${score}</div>`,
      iconSize:[aid===id?50:42,aid===id?50:42],
      iconAnchor:[aid===id?25:21,aid===id?25:21]
    });
    m.setIcon(icon);
  });
}

function switchPanel(p) {
  document.getElementById('wPanel').style.display = p==='w' ? 'block' : 'none';
  document.getElementById('rPanel').style.display = p==='r' ? 'block' : 'none';
  document.getElementById('ptW').classList.toggle('on', p==='w');
  document.getElementById('ptR').classList.toggle('on', p==='r');
}

function updateAll() {
  renderMap();
  renderRanking();
  if (selectedArea) renderRightPanel(selectedArea);
  const top = Math.max(...AREAS.map(a => calcScore(a)));
  document.getElementById('hTop').textContent = top;
}

// ============================================================
// SAVE / LOCALSTORAGE
// ============================================================

function loadSaves() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch(e) { return []; }
}

function persistSave(entry) {
  const saves = loadSaves();
  saves.unshift(entry);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(saves.slice(0, 100)));
}

function updateSaveCount() {
  const n = loadSaves().length;
  document.getElementById('hSave').textContent = n;
  document.getElementById('saveCount').textContent =
    n > 0 ? `保存済み: ${n}件 ▸ 一覧を見る` : '保存済み: 0件';
}

function saveAnalysis() {
  if (!selectedArea) { alert('エリアを選択してください'); return; }
  const area = AREAS.find(a => a.id === selectedArea);
  const score = calcScore(area);
  const catScores = calcCatScores(area);
  const genreLabel = GENRES.find(g => g.id === currentGenre)?.label || currentGenre;

  const entry = {
    id: Date.now(),
    timestamp: new Date().toLocaleString('ja-JP'),
    genre: currentGenre,
    genreLabel,
    areaId: selectedArea,
    areaName: area.name,
    score,
    grade: gradeInfo(score).label,
    catScores: catScores.map(({cat, score:s}) => ({id:cat.id, label:cat.label, score:s})),
    weights: {...weights},
  };

  persistSave(entry);
  updateSaveCount();

  const btn = document.getElementById('saveBtn');
  btn.innerHTML = '✓ 保存しました';
  btn.style.background = 'var(--green)';
  setTimeout(() => {
    btn.innerHTML = '<span>📌</span> この分析を保存';
    btn.style.background = '';
  }, 1500);
}

function deleteSave(idx) {
  const saves = loadSaves();
  saves.splice(idx, 1);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(saves));
  renderSavedList();
  updateSaveCount();
}

function clearAllSaves() {
  if (!confirm('保存済みの分析をすべて削除しますか？')) return;
  localStorage.removeItem(STORAGE_KEY);
  renderSavedList();
  updateSaveCount();
}

// ============================================================
// SAVED MODAL
// ============================================================

function openSavedModal() {
  renderSavedList();
  document.getElementById('savedModal').classList.add('open');
}

function closeSavedModal() {
  document.getElementById('savedModal').classList.remove('open');
}

function renderSavedList() {
  const saves = loadSaves();
  const list = document.getElementById('savedList');
  if (saves.length === 0) {
    list.innerHTML = '<div class="modal-empty">保存済みの分析はありません<br><span style="font-size:11px">エリアを選択して「この分析を保存」を押してください</span></div>';
    return;
  }
  list.innerHTML = saves.map((s, i) => {
    const g = gradeInfo(s.score);
    const cats = (s.catScores || []).map(c => `${c.label} ${c.score}`).join(' / ');
    return `
    <div class="save-item">
      <div class="save-item-score" style="color:${g.color}">${s.score}</div>
      <div class="save-item-body">
        <div class="save-item-name">${s.areaName}<span class="save-item-genre">／ ${s.genreLabel}</span></div>
        <div class="save-item-meta">${s.timestamp} ・ <span style="color:${g.color}">${g.label}</span></div>
        ${cats ? `<div class="save-item-cats">${cats}</div>` : ''}
      </div>
      <button class="save-del" onclick="deleteSave(${i})">削除</button>
    </div>`;
  }).join('');
}

// ============================================================
// EXPORT
// ============================================================

function exportCSV() {
  const saves = loadSaves();
  if (saves.length === 0) { alert('保存済みデータがありません'); return; }
  const catLabels = (saves[0].catScores || []).map(c => c.label);
  const headers = ['日時', '業種', 'エリア', 'スコア', 'グレード', ...catLabels];
  const rows = saves.map(s => [
    s.timestamp, s.genreLabel, s.areaName, s.score, s.grade,
    ...(s.catScores || []).map(c => c.score)
  ]);
  const csv = [headers, ...rows]
    .map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(','))
    .join('\n');
  downloadFile('﻿' + csv, `marketscope_${Date.now()}.csv`, 'text/csv;charset=utf-8');
}

function exportJSON() {
  const saves = loadSaves();
  if (saves.length === 0) { alert('保存済みデータがありません'); return; }
  downloadFile(JSON.stringify(saves, null, 2), `marketscope_${Date.now()}.json`, 'application/json');
}

function downloadFile(content, filename, type) {
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

// ============================================================
// ADDRESS SEARCH
// ============================================================

async function searchAddress() {
  const q = document.getElementById('addrInput').value.trim();
  if (!q) return;
  const hint = document.getElementById('mapHint');
  hint.textContent = '検索中...';
  hint.style.display = 'block';
  try {
    const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1&countrycodes=jp`;
    const res = await fetch(url);
    const data = await res.json();
    if (data.length > 0) {
      const lat = parseFloat(data[0].lat);
      const lon = parseFloat(data[0].lon);
      map.setView([lat, lon], 15);
      let near = null, minD = Infinity;
      AREAS.forEach(a => {
        const d = Math.hypot(a.lat - lat, a.lng - lon);
        if (d < minD) { minD = d; near = a; }
      });
      if (near) {
        selectArea(near.id);
      } else {
        hint.textContent = '地図上のエリアをクリックして分析';
      }
    } else {
      hint.textContent = '住所が見つかりませんでした';
      hint.style.display = 'block';
      setTimeout(() => { hint.style.display = 'none'; }, 3000);
    }
  } catch(e) {
    hint.textContent = '検索に失敗しました';
    hint.style.display = 'block';
    setTimeout(() => { hint.style.display = 'none'; }, 3000);
  }
}

document.getElementById('addrInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') searchAddress();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSavedModal();
});

renderGenreTabs();
renderPresets();
renderSliders();
renderMap();
renderRanking();
updateSaveCount();
